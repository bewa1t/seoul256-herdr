# seoul256 for herdr (https://github.com/bewa1t/seoul256-herdr).
# Colors from seoul256.vim by Junegunn Choi (MIT). Add this to
# ~/.config/herdr/config.toml in place of any [theme] section you have.
# herdr switches between the dark and light colors when the terminal reports a
# light/dark change.
[theme]
auto_switch = true

[theme.custom]
sidebar_bg = "reset"

[theme.custom.dark]
text = "#D9D9D9"
subtext0 = "#BFBFBF"
overlay1 = "#A8A8A8"
overlay0 = "#929292"
panel_bg = "#3F3F3F"
active_row_bg = "#565656"
selection_bg = "#007173"
surface0 = "#565656"
surface1 = "#616161"
surface_dim = "#565656"
accent = "#98BEDE"
blue = "#98BEDE"
teal = "#97DDDF"
green = "#98BC99"
yellow = "#DFBC72"
peach = "#E19972"
red = "#E17899"
mauve = "#E0BEBC"

[theme.custom.light]
text = "#616161"
subtext0 = "#6B6B6B"
overlay1 = "#757575"
overlay0 = "#8A8A8A"
panel_bg = "#E9E9E9"
active_row_bg = "#D1D0D1"
selection_bg = "#BCDEDE"
surface0 = "#D1D0D1"
surface1 = "#C8C8C8"
surface_dim = "#D9D9D9"
accent = "#7299BC"
blue = "#7299BC"
teal = "#009799"
green = "#719872"
yellow = "#9A7200"
peach = "#E19972"
red = "#BF2172"
mauve = "#9A7599"
